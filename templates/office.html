<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' blob:; font-src 'self'; worker-src blob:; base-uri 'self'; form-action 'self'">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%2300f0ff' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%2300f0ff'/%3E%3C/svg%3E">
    <title>F.R.I.D.A.Y. Office Dock</title>
    <link rel="stylesheet" href="/static/css/office.css">
    <script src="/static/js/office.js" defer></script>
</head>
<body>
    <!-- BOOT OVERLAY: reports real backend health from /api/health -->
    <div id="boot-overlay">
        <div class="boot-box">
            <div class="boot-rings">
                <div class="boot-ring r1"></div>
                <div class="boot-ring r2"></div>
                <div class="boot-ring r3"></div>
                <div class="boot-core"></div>
            </div>
            <div id="boot-title">OFFICE DOCK</div>
            <div id="boot-status">INITIALIZING</div>
            <div class="boot-bar"><div class="boot-bar-fill" id="boot-fill"></div></div>
            <div id="boot-percent">0%</div>
        </div>
    </div>

    <div class="dock">
        <div class="dock-header">
            <div class="dock-title">F.R.I.D.A.Y. OFFICE DOCK</div>
            <a class="back-link" href="/">← BACK TO CORE</a>
        </div>

        <div class="panel">
            <h2>Saved Links</h2>
            <div class="link-grid" id="link-grid"></div>
            <div class="add-row">
                <input type="text" id="link-name" placeholder="name (e.g. gmail)" maxlength="40">
                <input type="text" id="link-url" placeholder="https://mail.google.com">
                <button id="save-btn">Save Link</button>
            </div>
        </div>

        <div id="status-text">OFFICE STANDBY</div>
    </div>
    <div class="toast" id="toast"></div>
</body>
</html>
